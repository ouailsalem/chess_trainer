name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "apk/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        working-directory: apk
        run: npm install

      - name: Copy the web app into the wrapper
        run: |
          mkdir -p apk/www
          cp index.html manifest.webmanifest icon-*.png stockfish-19*.js stockfish-19*.wasm apk/www/
          cp -r plk apk/www/
          [ -d players ] && cp -r players apk/www/ || true

      - name: Create the Android project
        working-directory: apk
        run: |
          npx cap add android
          mkdir -p assets
          convert ../icon-512.png -resize 1024x1024 assets/icon-only.png
          convert ../icon-maskable.png -resize 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#1b2326' assets/icon-background.png
          npx @capacitor/assets generate --android || echo "icon generation skipped"
          npx cap sync android

      - name: Build the APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../OpeningTrainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpeningTrainer-apk
          path: OpeningTrainer.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          body: "Debug-signed APK built from ${{ github.sha }}. Download OpeningTrainer.apk on your phone and open it to install."
          files: OpeningTrainer.apk
          make_latest: true

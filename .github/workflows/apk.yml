name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "apk/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        working-directory: apk
        run: npm install

      - name: Copy the web app into the wrapper
        run: |
          mkdir -p apk/www
          cp index.html manifest.webmanifest icon-*.png stockfish-19*.js stockfish-19*.wasm apk/www/
          cp -r plk apk/www/
          [ -d players ] && cp -r players apk/www/ || true

      - name: Create the Android project
        working-directory: apk
        run: |
          set -x
          npx cap add android
          npx cap sync android

      - name: Native Stockfish and the plugin that runs it
        working-directory: apk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/official-stockfish/Stockfish/releases/latest \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if a['name'].startswith('stockfish-android-armv8') and 'dotprod' not in a['name']))")
          echo "Stockfish: $url"
          mkdir -p /tmp/sf && curl -fsSL "$url" -o /tmp/sf/sf.tar && tar -xf /tmp/sf/sf.tar -C /tmp/sf
          bin=$(find /tmp/sf -type f -name 'stockfish-android-armv8*' ! -name '*.tar' | head -1)
          echo "binary: $bin"; ls -la "$bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$bin" android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          D=android/app/src/main/java/io/github/ouailsalem/chesstrainer
          mkdir -p $D && cp native/StockfishPlugin.java native/MainActivity.java $D/
          python3 - <<'PY'
          import re
          p="android/app/build.gradle";s=open(p).read()
          s+="\nandroid { packagingOptions { jniLibs { useLegacyPackaging = true } } }\n"
          open(p,"w").write(s)
          PY
          tail -3 android/app/build.gradle

      - name: App icon
        working-directory: apk
        continue-on-error: true
        run: |
          pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          Image.open("../icon-512.png").convert("RGBA").resize((1024,1024)).save("assets/icon-only.png")
          Image.open("../icon-maskable.png").convert("RGBA").resize((1024,1024)).save("assets/icon-foreground.png")
          Image.new("RGBA",(1024,1024),(27,35,38,255)).save("assets/icon-background.png")
          PY
          npx @capacitor/assets generate --android

      - name: Build the APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../OpeningTrainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpeningTrainer-apk
          path: OpeningTrainer.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          body: "Debug-signed APK built from ${{ github.sha }}. Download OpeningTrainer.apk on your phone and open it to install."
          files: OpeningTrainer.apk
          make_latest: true
